<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="ui.css" />
  <style>
    body { width: 300px; padding: 12px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 10px; }
    .stat { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
    .stat b { display: block; font-size: 18px; }
    ul { list-style: none; margin: 6px 0 10px; padding: 0; }
    li { padding: 3px 0; border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <strong>HN Job Marks</strong>
  <div class="stats">
    <div class="stat"><b id="applied">0</b>applied</div>
    <div class="stat"><b id="hidden">0</b>not interested</div>
  </div>
  <div class="muted">Recently applied</div>
  <ul id="recent"></ul>
  <button id="open" class="btn primary">Open full list</button>
  <a class="btn" href="https://claude.ai/artifact/UP3iUaYpYEqokmi7MznqdT" target="_blank">Job Marks page ↗</a>
  <p class="muted">Mark posts on any HN "Who is hiring?" thread.</p>
  <script src="marks.js"></script>
  <script src="popup.js"></script>
</body>
</html>
